name: stock-mine

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stock-mine-api:20260914-monitor-r2
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1792m
    cpus: 1.5
    pids_limit: 192
    stop_grace_period: 60s
    environment:
      STOCK_MINE_MONITOR_SCHEDULE_ENABLED: "1"
    volumes:
      - ../data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: nginx:alpine@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    ports:
      # Keep SSH access; Lucky proxies the published HTTP port.
      - "127.0.0.1:18765:8080"
      - "0.0.0.0:5175:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
